name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build-installer:
    name: Build native installer (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Pre-build standalone server (required by Tauri bundler)
        run: npm run rust:build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig

  build-macos:
    name: Build .dmg (macOS universal)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      # Same requirement the Windows job has: the bundler expects every [[bin]]
      # in Cargo.toml to exist, standalone-server included, and a universal app
      # needs a universal copy of it.
      - name: Pre-build standalone-server (required by the Tauri bundler)
        run: bash scripts/prebuild-standalone-server.sh universal

      # Builds one binary that runs natively on both Apple Silicon and Intel,
      # so there is a single .dmg for users to choose from.
      #
      # Two mutually exclusive steps, because an absent secret arrives as an
      # empty string rather than an unset variable, and Tauri reads a *defined*
      # APPLE_CERTIFICATE as "signing was requested" — then dies with "failed to
      # import keychain certificate" trying to import nothing. The env block
      # cannot express "omit this key", so the choice is made with `if:`
      # instead.
      - name: Build Tauri app (universal, signed)
        if: ${{ secrets.APPLE_CERTIFICATE != '' }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: --config src-tauri/tauri.macos.conf.json --target universal-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (separate from Apple signing).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple "Developer ID Application" cert, exported as a base64 .p12.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # Notarization credentials (Apple ID + app-specific password).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Tauri app (universal, unsigned)
        if: ${{ secrets.APPLE_CERTIFICATE == '' }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: --config src-tauri/tauri.macos.conf.json --target universal-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Warn that the release is unsigned
        if: ${{ secrets.APPLE_CERTIFICATE == '' }}
        run: echo "::warning title=Unsigned macOS release::This .dmg is unsigned, so Gatekeeper will block it on first launch and users must right-click the app and choose Open. Set the APPLE_* secrets (docs/MACOS.md) before publishing a release you expect people to install."

      - name: Report signing status
        run: |
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "No .app bundle found" && exit 1
          fi
          echo "Bundle: $APP"
          codesign -dv --verbose=2 "$APP" 2>&1 || true
          echo "--- Gatekeeper assessment ---"
          if spctl -a -vvv -t install "$APP" 2>&1; then
            echo "SIGNED AND ACCEPTED: this .dmg will open with a normal double-click."
          else
            echo "::warning title=Unsigned macOS build::The .dmg is unsigned/un-notarized. It works, but macOS will block it on first launch until the user right-click-opens it. Add the APPLE_* secrets to fix this."
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  build-portable:
    name: Build portable zip (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run portable packaging script
        shell: cmd
        run: scripts\package-portable.bat

      - name: Zip portable build
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}".TrimStart("v")
          $folder = "SatisfactoryLayoutTool-$version-windows"
          if (-not (Test-Path "dist-portable/$folder")) {
            # The script names the folder using the package.json version, which
            # may not match the tag. Fall back to whatever folder is present.
            $folder = (Get-ChildItem -Directory dist-portable | Select-Object -First 1).Name
          }
          Compress-Archive -Path "dist-portable/$folder" -DestinationPath "dist-portable/$folder.zip"
          Get-ChildItem dist-portable

      - name: Upload portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist-portable/*.zip

  publish-release:
    name: Publish GitHub release
    needs: [build-installer, build-portable, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./release-files/installer

      - name: Download portable artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: ./release-files/portable

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-universal
          path: ./release-files/macos

      - name: List files
        run: find ./release-files -type f

      - name: Create latest.json for auto-updater
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          VERSION_NUM="${VERSION#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${VERSION}"

          PLATFORMS='{}'

          # The product name contains spaces, and GitHub replaces every space in
          # a release asset's filename with a dot when it stores it. The URL in
          # this manifest has to match what GitHub actually serves, not the
          # local filename, or the updater downloads a 404.
          asset_url() { echo "${BASE}/$(basename "$1" | tr ' ' '.')"; }

          # --- Windows -------------------------------------------------------
          EXE_FILE=$(find ./release-files/installer -name "*.exe" ! -name "*.sig" 2>/dev/null | head -1 || true)
          if [ -n "$EXE_FILE" ] && [ -f "${EXE_FILE}.sig" ]; then
            PLATFORMS=$(jq -n \
              --argjson p "$PLATFORMS" \
              --arg sig "$(cat "${EXE_FILE}.sig")" \
              --arg url "$(asset_url "$EXE_FILE")" \
              '$p + {"windows-x86_64": {signature: $sig, url: $url}}')
          else
            echo "::warning title=No Windows updater entry::Missing .exe or its .sig; Windows installs will not see this update."
          fi

          # --- macOS ---------------------------------------------------------
          # One universal .app.tar.gz serves both architectures. All three keys
          # point at it so the updater resolves whichever target string the
          # installed build reports.
          MAC_FILE=$(find ./release-files/macos -name "*.app.tar.gz" 2>/dev/null | head -1 || true)
          if [ -n "$MAC_FILE" ] && [ -f "${MAC_FILE}.sig" ]; then
            PLATFORMS=$(jq -n \
              --argjson p "$PLATFORMS" \
              --arg sig "$(cat "${MAC_FILE}.sig")" \
              --arg url "$(asset_url "$MAC_FILE")" \
              '$p + {"darwin-universal": {signature: $sig, url: $url},
                     "darwin-aarch64":  {signature: $sig, url: $url},
                     "darwin-x86_64":   {signature: $sig, url: $url}}')
          else
            echo "::warning title=No macOS updater entry::Missing .app.tar.gz or its .sig; macOS installs will not see this update."
          fi

          jq -n \
            --arg version "$VERSION_NUM" \
            --arg notes "Release ${VERSION}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > ./release-files/latest.json

          cat ./release-files/latest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, 'beta') || contains(steps.get_version.outputs.VERSION, 'alpha') || contains(steps.get_version.outputs.VERSION, 'rc') }}
          files: |
            ./release-files/installer/**/*.exe
            ./release-files/installer/**/*.msi
            ./release-files/installer/**/*.sig
            ./release-files/portable/*.zip
            ./release-files/macos/**/*.dmg
            ./release-files/macos/**/*.app.tar.gz
            ./release-files/macos/**/*.app.tar.gz.sig
            ./release-files/latest.json
          body: |
            ## Satisfactory Layout Tool ${{ steps.get_version.outputs.VERSION }}

            ### 🎮 For Users — Just Want to Use It?

            Pick **one** of these:

            **Option A: Installer (recommended)**
            1. Download the `.exe` file (e.g., `Satisfactory_Layout_Tool_*.exe`)
            2. Double-click to install
            3. Launch from Start Menu
            4. If Windows shows "Windows protected your PC", click *More info* → *Run anyway*

            **Option B: Portable zip (no install required)**
            1. Download `SatisfactoryLayoutTool-*-windows.zip`
            2. Extract anywhere (e.g., your Desktop)
            3. Double-click `SatisfactoryLayoutTool.exe` inside the extracted folder
            4. The app opens in your browser — keep the launcher window open while using it

            **Option C: macOS**
            1. Download the `.dmg` — one file covers both Apple Silicon and Intel Macs
            2. Open it and drag the app into Applications
            3. On first launch, **right-click the app and choose *Open*** (double-clicking
               will show "cannot be verified" or "is damaged" instead). You only need to
               do this once.

            Full macOS notes → [docs/MACOS.md](https://github.com/${{ github.repository }}/blob/main/docs/MACOS.md)

            No account, no key, no internet connection required after install. 🎉

            ### 🛠️ For Developers

            See [README.md](https://github.com/${{ github.repository }}#quick-start) for build instructions.

            ### 📦 What's in this release

            | File | Use case |
            |------|----------|
            | `*.exe` | Windows installer (NSIS) — registers in Start Menu, supports auto-update |
            | `*.msi` | Windows installer (MSI) — for IT-managed deployments |
            | `*-windows.zip` | Portable build — no install, runs in your browser |
            | `*.dmg` | macOS installer (universal: Apple Silicon + Intel) |
            | `*.app.tar.gz` | macOS auto-update payload — not for manual download |
            | `latest.json` | Auto-updater manifest — used by installed apps to check for updates |
            | `*.sig` | Cryptographic signatures for the installers |

            ### License
            AGPL-3.0-or-later with attribution-preservation terms.
            See [LICENSE](https://github.com/${{ github.repository }}/blob/main/LICENSE).
